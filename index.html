<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Top 3 équipe</title>
<!--
NOTE DE STRUCTURE (M11)
Appli      : Suivi Top 3 équipe · version 2.0 (site web) · PE Batilly - PE Logistique
Fichiers   : index.html (ce site, hébergé sur GitHub Pages) + firestore.rules + README.md (mise en ligne).
Stockage   : base Firebase Firestore (temps réel, cache hors ligne sur chaque appareil) ; connexion anonyme
             automatique, aucun compte à créer. Réglages propres à l'appareil : localStorage « top3_* ».
Accès      : une équipe = un identifiant secret de 24 caractères dans le lien (…/#t=XXXX). Sans ce lien,
             personne ne peut lire ni écrire (règles Firestore : pas de liste des équipes).
Données    : un document par case ; la dernière saisie remplace la précédente.
             teams/{équipe} {name, created, by} · members/{id} t:"m" {name,email,order} | null
             actions/{id} t:"a" {text,owner,week,day,done,first,created} | null · config/{clé} t:"c" (deadline, samedi)
             cells/{lundi}_{membre}_{champ} t:"f" : f = t1-3 objectif, j1-3 jours prévus, d1-3 atteint,
             s1-6 présence, p1-6 priorité du jour ; lu semaine par semaine (where w == lundi).
             Format d'événement identique aux versions 1.x : une sauvegarde 1.x se restaure dans le site.
Règles     : une case est en rouge si elle est vide après l'heure limite (9h30 par défaut) un jour travaillé
             (Présent, Télétravail, Déplacement). Un objectif du Top 3 écrit et prévu ce jour-là compte comme priorité
             du jour. Jours fériés : Code du travail, art. L3133-1 ; Pâques calculé (algorithme de Meeus).
             Action en retard : jour prévu passé (ou samedi passé si sans jour), non faite.
Sorties    : sauvegardes JSON et exports CSV dans Téléchargements.
Tests      : ⚙ > Réglages avancés > Auto-contrôle (8 tests de l'appli). Tests du socle du gabarit v1.5 : gabarit non fourni.
Versions   : 1.0 à 1.5 (12/11/2026) fichier partagé par dossier Teams · 2.0 (13/11/2026) site web Firebase + GitHub Pages,
             sans compte, temps réel, téléphone.
-->
<style>
/* Rendu du service (chapitre R du standard) : barre du haut, cadre à coins coupés, titres à carré jaune. */
:root{
  /* code couleur des présences : liseré (st) et teinte de la case (tt) */
  --st-present:#1E9E5A; --st-tele:#0047FF; --st-dep:#139E86; --st-form:#B57F0E; --st-conge:#E3870B; --st-abs:#D23B2F; --st-repos:#7A818B; --st-ferie:#5B616B;
  --tt-tele:#E6EDFF; --tt-dep:#E0F3EF; --tt-form:#F5EDDB; --tt-conge:#FDEBD3; --tt-abs:#FBE7E5; --tt-off:#ECEEF1;
  --ink:#1C1F24; --text:#30353C; --gray:#5B616B; --line:#CDD2D9; --yellow:#FFCC33; --on-yellow:#1C1F24;
  --block:#F2F4F6; --page:#E9ECEF; --card:#FFFFFF; --field:#7A818B;
  --green:#1E9E5A; --orange:#E3870B; --red:#D23B2F;
  --t-green:#1E7A47; --t-orange:#9A5A00; --t-red:#B32A20;
  --tint-y:#FFF5D6; --tint-g:#E3F4EA; --tint-o:#FDEBD3; --tint-r:#FBE7E5;
  --head-bg:#1C1F24; --head-fg:#FFFFFF; --shade:rgba(0,0,0,.55);
  --font:Aptos,Calibri,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --ink:#F2F4F6; --text:#DDE1E6; --gray:#A9B0BA; --line:#3A4048; --block:#23272D; --page:#121417; --card:#1A1D21; --field:#7D848E;
  --t-green:#4CC98A; --t-orange:#F5A524; --t-red:#FF7B70;
  --tint-y:#3A3114; --tint-g:#16301F; --tint-o:#3A2A14; --tint-r:#3B1D1B;
  --head-bg:#2B3037; --shade:rgba(0,0,0,.65); color-scheme:dark;
  --st-tele:#5B8CFF; --st-dep:#1E9C84; --st-form:#C9952F; --st-repos:#7D848E; --st-ferie:#A9B0BA;
  --tt-tele:#17213D; --tt-dep:#0F2B26; --tt-form:#2E2512; --tt-conge:#3A2A14; --tt-abs:#3B1D1B; --tt-off:#23272D}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:11pt/1.45 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barre du haut */
.appbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.appname{font-size:14pt;font-weight:700;color:var(--ink);line-height:1.15}
.appver{font-size:9.5pt;color:var(--gray)}
.appbar .grow{flex:1}
.state{display:inline-flex;align-items:center;gap:7px;font-size:9.5pt;color:var(--gray);background:none;border:0;cursor:pointer;padding:6px;border-radius:4px}
.state:hover{background:var(--block)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)}

/* boutons */
.btn{height:40px;padding:0 14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--card);color:var(--ink);font-weight:700;font-size:10.5pt;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--block)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--yellow);color:var(--on-yellow);border-color:var(--ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.sm{height:32px;padding:0 10px;font-size:10pt}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn.danger{color:var(--t-red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--block)}
.pastille{min-width:20px;height:20px;border-radius:10px;background:#1C1F24;color:#FFCC33;font-size:9pt;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}

/* bandeau unique */
#banner{display:none}
#banner.on{display:block}
#banner .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-weight:600}
#banner .grow{flex:1}
#banner.b-red{background:var(--tint-r);border-bottom:2px solid var(--red)}
#banner.b-orange{background:#E3870B;color:#1C1F24}
#banner.b-orange .btn{background:#FFFFFF;color:#1C1F24;border-color:#1C1F24}
#banner.b-yellow{background:var(--tint-y);border-bottom:2px solid var(--yellow)}

/* page */
.page{max-width:1120px;margin:0 auto;padding:16px 16px 72px}
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin-bottom:14px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 360px;min-width:0;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{height:42px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;font-size:10.5pt;color:var(--gray);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow)}
.av{width:24px;height:24px;border-radius:50%;background:var(--block);border:1px solid var(--line);color:var(--ink);font-size:8.5pt;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.av.me{background:var(--yellow);border-color:var(--yellow);color:#1C1F24}
.cnt{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:8.5pt;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:6px}
.wkbadge{height:30px;min-width:44px;padding:0 6px;background:#1C1F24;color:#FFCC33;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border-radius:2px}
.range{font-size:10pt;color:var(--gray);white-space:nowrap}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:270px;display:flex;flex-direction:column;gap:8px}
.pop .row{display:flex;gap:6px;flex-wrap:wrap}
.pop label{display:flex;align-items:center;gap:8px;padding:4px 2px;cursor:pointer}
.pop input[type=checkbox]{width:18px;height:18px;accent-color:#1C1F24}

/* cadre à coins coupés */
.frame{position:relative;background:var(--ink);padding:1px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.frame>.fin{position:relative;background:var(--card);padding:20px 24px 28px;clip-path:polygon(15.4px 0,calc(100% - 15.4px) 0,100% 15.4px,100% calc(100% - 15.4px),calc(100% - 15.4px) 100%,15.4px 100%,0 calc(100% - 15.4px),0 15.4px)}
.frame>.fin::before{content:"";position:absolute;top:0;left:16px;width:140px;height:5px;background:var(--yellow)}
@media (max-width:600px){.frame>.fin{padding:18px 14px 22px}}

/* titres de section */
.sec{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:11.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink)}
.sec::before{content:"";width:12px;height:12px;background:var(--yellow);flex:none}
.sec .fil{flex:1;height:1px;background:var(--line);min-width:20px}
.sec .meta{font-size:9.5pt;font-weight:400;letter-spacing:0;text-transform:none;color:var(--gray)}
.blk+.blk{margin-top:26px}
@media (max-width:600px){.sec .meta{display:none}.sec{letter-spacing:.08em}}

/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--block);border:0;border-top:3px solid var(--yellow);padding:10px 14px;text-align:left;color:inherit;font:inherit}
button.tile{cursor:pointer}
button.tile:hover{filter:brightness(.98)}
.tile .v{font-size:20pt;font-weight:700;color:var(--ink);line-height:1.1}
.tile .l{font-size:10pt;color:var(--gray)}
.tile.ok{border-top-color:var(--green)} .tile.warn{border-top-color:var(--orange)} .tile.bad{border-top-color:var(--red)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* étiquettes d'état */
.et{display:inline-flex;align-items:center;gap:4px;font-size:9.5pt;font-weight:700;border-radius:3px;padding:1px 7px;white-space:nowrap;line-height:1.5}
.et.ok{background:#1E9E5A;color:#fff}
.et.warn{background:#E3870B;color:#1C1F24}
.et.bad{background:#D23B2F;color:#fff}
.et.neu{background:var(--block);color:var(--gray);box-shadow:inset 0 0 0 1px var(--line)}

/* tableau équipe */
.board-scroll{overflow-x:auto;border:1px solid var(--line)}
table.board{border-collapse:separate;border-spacing:0;width:100%;font-size:10.5pt}
.board th,.board td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;text-align:left;padding:0}
.board tr>*:first-child{border-left:0}
.board tbody tr:last-child>*{border-bottom:0}
.board thead th{background:var(--head-bg);color:var(--head-fg)}
.board .rh{position:sticky;left:0;z-index:2;background:var(--card);width:112px;min-width:104px;padding:10px 12px;border-right:1px solid var(--line)}
.board thead .rh{background:var(--head-bg);z-index:3;vertical-align:bottom}
.rh .d{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10pt;color:var(--ink)}
.rh .dt{display:block;font-size:9pt;color:var(--gray)}
.rh .tg{display:inline-block;margin-top:6px;font-size:8.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--yellow);color:#1C1F24;padding:0 5px;border-radius:2px}
.rh .ho{display:block;margin-top:4px;font-size:9pt;color:var(--gray);font-style:italic}
.board .ph{min-width:230px;padding:10px 10px 10px 12px}
.ph .top{display:flex;align-items:flex-start;gap:6px}
.ph .nm{flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;font-weight:700;font-size:10pt;text-transform:uppercase;letter-spacing:.06em;overflow-wrap:anywhere}
.ph .nm:hover{text-decoration:underline}
.ph .x{background:none;border:1px solid rgba(255,255,255,.35);color:inherit;width:26px;height:26px;border-radius:3px;cursor:pointer;flex:none;font-size:11pt;line-height:1}
.ph .x:hover{border-color:#FFCC33}
.ph .st{margin-top:6px}
.ph.me{box-shadow:inset 0 -4px 0 #FFCC33}
tr.today>td,tr.today>.rh{background:var(--tint-y)}
tr.off>td{background:var(--block)}
td.c{min-width:230px}
.cell{display:flex;flex-direction:column;gap:6px;padding:8px 10px}
.board td.off-cell{background:var(--block)}
td.miss .case{border-color:var(--red);background:var(--tint-r)}

/* champs */
.inp{height:40px;width:100%;border:1px solid var(--field);border-radius:3px;padding:0 10px;background:var(--card);color:var(--text)}
.case{display:block;width:100%;min-height:40px;resize:none;overflow:hidden;border:1px solid var(--field);border-radius:3px;padding:9px 10px;background:var(--card);color:var(--text);line-height:1.35;field-sizing:content}
.case::placeholder,.inp::placeholder{color:var(--gray);opacity:.75}
.obj.empty.need{border-color:var(--red);background:var(--tint-r)}
/* présences : une couleur par statut (le texte reste toujours écrit) */
[data-st="Présent"]{--stc:var(--st-present);--stt:transparent}
[data-st="Télétravail"]{--stc:var(--st-tele);--stt:var(--tt-tele)}
[data-st="Déplacement"]{--stc:var(--st-dep);--stt:var(--tt-dep)}
[data-st="Formation"]{--stc:var(--st-form);--stt:var(--tt-form)}
[data-st="Congé"]{--stc:var(--st-conge);--stt:var(--tt-conge)}
[data-st="Absent"]{--stc:var(--st-abs);--stt:var(--tt-abs)}
[data-st="Repos"]{--stc:var(--st-repos);--stt:var(--tt-off)}
[data-st="Férié"]{--stc:var(--st-ferie);--stt:var(--tt-off)}
select.pres{align-self:flex-start;height:26px;font-size:9.5pt;font-weight:700;border:1px solid var(--line);border-left:5px solid var(--stc,var(--line));border-radius:3px;background:var(--card);color:var(--ink);padding:0 4px;cursor:pointer;max-width:100%}
body.pres-on .board td.c[data-st]{box-shadow:inset 4px 0 0 var(--stc)}
body.pres-on .board td.c[data-st]:not([data-st="Présent"]){background:var(--stt)}
body.pres-on .daycard[data-st]{box-shadow:inset 4px 0 0 var(--stc)}
body.pres-on .daycard[data-st]:not([data-st="Présent"]){background:var(--stt)}
body:not(.pres-on) select.pres,body:not(.pres-on) .legend{display:none}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:9.5pt;color:var(--gray);margin:0 0 12px}
.legend .lt{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:9pt;color:var(--ink)}
.legend .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend .lg::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--stc)}
.legend .lg span{color:var(--text)}
.btn[aria-pressed="false"]{border-style:dashed;color:var(--gray)}

/* top 3 */
.t3{display:flex;flex-direction:column;gap:10px;padding:10px}
.t3row{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px 8px;align-items:start}
.num{width:22px;height:22px;margin-top:9px;background:#1C1F24;color:#FFCC33;border:0;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:10pt;cursor:pointer;padding:0}
.num.done{background:#1E9E5A;color:#fff}
@media (prefers-color-scheme: dark){.num,.pchip .n,.wkbadge,.step .sq{box-shadow:inset 0 0 0 1px #5B616B}}
.t3row .inp{height:40px}
.daypick{display:flex;gap:3px;margin-top:4px}
.daypick label{position:relative;cursor:pointer}
.daypick input{position:absolute;opacity:0;width:1px;height:1px}
.daypick span{display:inline-flex;align-items:center;justify-content:center;width:23px;height:22px;border:1px solid var(--line);border-radius:3px;font-size:9pt;font-weight:700;color:var(--gray);background:transparent;user-select:none}
.daypick label:hover span{border-color:var(--ink)}
.daypick input:checked+span{background:var(--yellow);border-color:var(--yellow);color:#1C1F24}
.daypick input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:1px}
.daypick span.today{box-shadow:inset 0 -2px 0 var(--ink)}

/* éléments prévus dans un jour */
.items{display:flex;flex-direction:column;gap:4px}
.items:empty{display:none}
.irow{display:flex;gap:6px;align-items:flex-start}
.irow .items{flex:1;min-width:0}
.pplus{flex:none;min-width:24px;height:24px;padding:0 6px;white-space:nowrap;border:1px dashed var(--field);border-radius:3px;background:transparent;color:var(--gray);font-size:13pt;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pplus:hover{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--card)}
.pplus.need{height:28px;padding:0 10px;font-size:9.5pt;border:1px solid var(--red);background:var(--tint-r);color:var(--t-red)}
.pplus.need:hover{border-color:var(--red);color:var(--t-red);background:var(--tint-r);filter:brightness(.97)}
.pchip{display:flex;align-items:center;gap:7px;width:100%;min-width:0;background:var(--block);border:0;border-radius:3px;padding:3px 8px 3px 3px;font-size:9.5pt;color:var(--text);text-align:left;cursor:pointer}
tr.today .pchip,.daycard.today .pchip{background:var(--card)}
.pchip .n{width:18px;height:18px;flex:none;background:#1C1F24;color:#FFCC33;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:8.5pt;font-weight:700}
.pchip.done .n{background:#1E9E5A;color:#fff}
.pchip .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip:hover .t{text-decoration:underline}
.act{display:flex;align-items:flex-start;gap:7px;font-size:9.5pt;padding:2px 2px 2px 3px;border-radius:3px}
.act[draggable="true"]{cursor:grab}
.act input{flex:none;width:16px;height:16px;margin:2px 0 0;accent-color:#1E9E5A;cursor:pointer}
.act .t{flex:1;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.act .t:hover{text-decoration:underline}
.act.done .t{text-decoration:line-through;color:var(--gray)}
.act.late .t{color:var(--t-red);font-weight:600}
.more{align-self:flex-start;background:none;border:0;padding:0;font-size:9pt;color:var(--gray);text-decoration:underline;cursor:pointer}
.drop-over{outline:2px dashed var(--ink);outline-offset:-4px;background:var(--tint-y)!important}
body.dragging [data-drop]{outline:1px dashed var(--field);outline-offset:-4px}

/* vue personne */
.pv-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:22px}
.pv-head .av{width:40px;height:40px;font-size:12pt}
.pv-head .who{display:flex;flex-direction:column}
.pv-head .big{font-size:16pt;font-weight:700;color:var(--ink);line-height:1.1}
.pv-head .sub{font-size:10pt;color:var(--gray)}
.pv-head .grow{flex:1}
.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.topcard{background:var(--block);border-top:3px solid var(--yellow);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.topcard.done{border-top-color:var(--green)}
.topcard.need{border-top-color:var(--red)}
.topcard .hd{display:flex;align-items:center;gap:8px}
.topcard .hd .num{margin:0}
.topcard .hd .lb{font-size:9.5pt;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;flex:1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:9.5pt;font-weight:700;color:var(--gray);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:#1E9E5A}
.week6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.week6.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.week6,.week6.five{grid-template-columns:repeat(3,minmax(0,1fr))}.tops{grid-template-columns:1fr}}
@media (max-width:620px){.week6,.week6.five{grid-template-columns:1fr}}

        li(h("b", null, "Je ne vois pas la saisie d'un collègue ?"), " Vérifie l'état en haut à droite : « Hors ligne » ou une erreur empêche la mise à jour. Sinon, recharge la page."),
        li(h("b", null, "Deux personnes modifient la même case ?"), " La saisie la plus récente gagne."),

  });

/* ——————————— Exemple ——————————— */
function loadExample() {
  if (EXAMPLE) return;
  flushEdits();
  EXAMPLE = { EVENTS, VIEW, HIDDEN };
  EVENTS = new Map(); HIDDEN = new Set();
  const cur = mondayOf(new Date()), w = ymd(cur), prev = ymd(addDays(cur, -7)), nxt = ymd(addDays(cur, 7));
  let ts = 1;
  const put = (e) => { e.id = "ex" + ts; e.ts = ts++; e.by = "Exemple"; EVENTS.set(evKey(e), e); };
  const people = [["exa", "Julie MARTIN"], ["exb", "Karim BENALI"], ["exc", "Léa ROUSSEL"], ["exd", "Hugo PETIT"]];
  people.forEach(([id, name], i) => put({ t: "m", m: id, v: { name, email: "", order: i } }));
  const f = (m, fld, v) => put({ t: "f", w, m, f: fld, v });
  f("exa", "t1", "Valider le plan de charge des AMR"); f("exa", "j1", "1,3"); f("exa", "t2", "Former 2 caristes à la ligne d'échange"); f("exa", "j2", "4"); f("exa", "t3", "Clore les écarts de l'audit 5S"); f("exa", "j3", "5"); f("exa", "d1", "1");
  f("exb", "t1", "Réception des conteneurs semaine 47"); f("exb", "j1", "2"); f("exb", "t2", "Mettre à jour les étiquettes Data Matrix"); f("exb", "j2", "3,4");
  f("exc", "t1", "Préparer la revue projet de vendredi"); f("exc", "j1", "5"); f("exc", "t2", "Relancer le fournisseur de bacs"); f("exc", "t3", "Plan de formation T1");
  f("exd", "s1", "Congé"); f("exd", "s2", "Congé");
  const ti = ((new Date().getDay() + 6) % 7) + 1;
  for (let i = 1; i < Math.min(ti, 6); i++) { f("exa", "p" + i, ["Plan de charge AMR", "Point sécurité début de poste", "Arbitrage plan de charge", "Formation caristes", "Audit 5S zone BDC"][i - 1]); if (i % 2) f("exc", "p" + i, ["Revue des écarts", "", "Relance fournisseur bacs", "", "Revue projet"][i - 1]); }
  const act = (id, text, owner, week, day, done) => put({ t: "a", m: id, v: { text, owner, week, day, done: !!done, doneAt: done ? Date.now() : 0, first: week ? `${week}|${day}` : "", created: ts } });
  act("xa1", "Commander 20 bacs KLT pour la zone BDC", "exb", prev, 4, false);
  act("xa2", "Mettre à jour la cartographie RCS", "exa", "", 0, false);
  act("xa3", "Planifier l'audit 5S du magasin", "exc", "", 0, false);
  act("xa4", "Point fournisseur Hikrobot", "exa", w, Math.min(Math.max(ti, 1), 5), false);
  act("xa5", "Envoyer le compte rendu de la revue", "exc", nxt, 1, false);
  act("xa6", "Vérifier les badges visiteurs", "exb", w, 1, true);
  ME = ""; VIEW = "team"; replay(); STRUCT = ""; TABSIG = ""; render(); window.scrollTo({ top: 0 });
}
function quitExample() {
  if (!EXAMPLE) return;
  ({ EVENTS, VIEW, HIDDEN } = EXAMPLE); EXAMPLE = null; ME = LS.get("me", "");
  replay(); STRUCT = ""; TABSIG = ""; render(); toast("Exemple fermé : tes données sont revenues.");
}

/* ——————————— messages, navigation ——————————— */
let toastTimer = null;
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 4000); }
function goWeek(d) { flushEdits(); monday = mondayOf(d); weekKey = ymd(monday); STRUCT = ""; TABSIG = ""; subscribeWeek(); render(); }
on($("#prev"), "click", () => goWeek(addDays(monday, -7)));
on($("#next"), "click", () => goWeek(addDays(monday, 7)));
on($("#thisweek"), "click", () => goWeek(new Date()));
on($("#diffuser"), "click", diffuserWin);
on($("#aide"), "click", () => helpWin());
on($("#reglages"), "click", settingsWin);
on($("#state"), "click", () => { if (EXAMPLE) return; if (CLOUD.state === "team") { if (CLOUD.err) location.reload(); else toast($("#state").title || "En ligne."); } else if (CLOUD.state === "error") location.reload(); else if (CLOUD.state === "ready") createTeamWin(); else settingsWin(); });
on($("#totop"), "click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("scroll", () => { $("#totop").hidden = window.scrollY < 300; }, { passive: true });

/* ——————————— démarrage ——————————— */
async function init() {
  replay();
  applyPres();
  render();
  setInterval(() => { update(); renderBanner(); setStateTxt(); }, 30000);
  window.addEventListener("online", () => { setStateTxt(); renderBanner(); });
  window.addEventListener("offline", () => { setStateTxt(); renderBanner(); });
  window.addEventListener("hashchange", () => { const t = teamFromHash(); if (t && t !== CLOUD.team && CLOUD.api) joinTeam(t); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushEdits(); });
  window.addEventListener("beforeunload", () => { flushEdits(); });
  await cloudStart();
  if (!USER && CLOUD.state === "team") setTimeout(() => { if (!USER && $("#win-bg").hidden) askName(); }, 400);
}
init();
